name: Food Intelligence CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  release-food-gates:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Scan tracked files for secrets
        run: npm run scan:secrets

      - name: Lint
        run: npm run lint

      - name: Run full Vitest suite
        run: env -u OPENAI_API_KEY npm test

      - name: Run named food release gates
        run: env -u OPENAI_API_KEY npm run test:release-food

      - name: Build production app
        run: npm run build
