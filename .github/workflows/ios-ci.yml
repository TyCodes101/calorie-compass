name: iOS CI

on:
  push:
    branches:
      - main
      - feature/ios-phase3-meal-management
      - feature/ios-phase4-app-store-polish
      - feature/ios-phase4d-stabilization
      - feature/ios-phase4e-testflight-readiness
  pull_request:
    branches:
      - main
      - feature/ios-phase3-profile
      - feature/ios-phase3-meal-management
      - feature/ios-phase4b-native-auth

jobs:
  ios-build:
    runs-on: macos-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List available simulators
        run: xcrun simctl list devices available

      - name: Resolve simulator destination
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          devices="$(xcrun simctl list devices available)"
          for name in "iPhone 17" "iPhone 17 Pro" "iPhone 17 Pro Max" "iPhone 16e" "iPhone 15" "iPhone 14"; do
            line="$(printf '%s\n' "$devices" | grep -E "^[[:space:]]+${name}[[:space:]]+\(" | head -n 1 || true)"
            if [[ -n "$line" ]]; then
              udid="$(printf '%s' "$line" | sed -E 's/.*\(([0-9A-Fa-f-]+)\).*/\1/')"
              echo "destination=platform=iOS Simulator,id=$udid" >> "$GITHUB_OUTPUT"
              echo "Using simulator: $name ($udid)"
              exit 0
            fi
          done
          echo "No preferred iPhone simulator found. Available devices:" >&2
          xcrun simctl list devices available >&2
          exit 1

      - name: Build Calorie Compass
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/CalorieCompass/CalorieCompass.xcodeproj \
            -scheme CalorieCompass \
            -destination '${{ steps.simulator.outputs.destination }}' \
            build | tee ios-build.log

      - name: Start deterministic Food Intelligence UI test backend
        shell: bash
        run: |
          set -euo pipefail
          node scripts/food-intelligence-ui-mock-server.mjs > food-intelligence-ui-server.log 2>&1 &
          echo $! > food-intelligence-ui-server.pid
          for attempt in {1..20}; do
            if curl --silent --fail 'http://127.0.0.1:8765/api/reusable-meals' >/dev/null; then
              exit 0
            fi
            sleep 0.25
          done
          cat food-intelligence-ui-server.log >&2
          exit 1

      - name: Test Calorie Compass
        env:
          MACROMESH_UI_TEST_BASE_URL: http://127.0.0.1:8765
        run: |
          set -o pipefail
          rm -rf ios-test-results.xcresult
          xcodebuild \
            -project ios/CalorieCompass/CalorieCompass.xcodeproj \
            -scheme CalorieCompass \
            -destination '${{ steps.simulator.outputs.destination }}' \
            -resultBundlePath ios-test-results.xcresult \
            test | tee ios-test.log

      - name: Upload iOS logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ci-logs
          path: |
            ios-build.log
            ios-test.log
            ios-test-results.xcresult
            food-intelligence-ui-server.log
